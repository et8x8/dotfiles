# プレフィックスキーをCtrl+gに変更
unbind C-b
set -g prefix C-g
bind C-g send-prefix

# マウス操作を有効化（スクロール・ペイン選択・リサイズ）
set -g mouse on

# ウィンドウ番号を1から開始（0は遠い）
set -g base-index 1
setw -g pane-base-index 1

# ペイン分割をわかりやすいキーに変更
bind | split-window -h
bind - split-window -v

# 設定リロードのショートカット
bind r source-file ~/.tmux.conf \; display "Reloaded!"
