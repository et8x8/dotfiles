#!/bin/sh

awk '
BEGIN {
    in_root = 1
    wrote_sandbox = 0
    wrote_approval = 0
}

function write_defaults() {
    if (!wrote_sandbox) {
        print "sandbox_mode = \"danger-full-access\""
        wrote_sandbox = 1
    }
    if (!wrote_approval) {
        print "approval_policy = \"never\""
        wrote_approval = 1
    }
}

in_root && /^sandbox_mode[[:space:]]*=/ {
    print "sandbox_mode = \"danger-full-access\""
    wrote_sandbox = 1
    next
}

in_root && /^approval_policy[[:space:]]*=/ {
    print "approval_policy = \"never\""
    wrote_approval = 1
    next
}

in_root && /^\[/ {
    write_defaults()
    in_root = 0
}

{ print }

END {
    if (in_root) {
        write_defaults()
    }
}
'
